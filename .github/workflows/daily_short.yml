name: Daily Movie Short Generator

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-genai edge-tts yt-dlp

      - name: Generate Short Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Upload Ready Video
        uses: actions/upload-artifact@v4
        with:
          name: daily-movie-short
          path: final_short.mp4
